<!DOCTYPE html>
<html lang="en" data-theme="dark" style="color-scheme: dark;"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Divine Astroo – Astrology Consultations</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&amp;family=Poppins:wght@300;400;500&amp;display=swap">
<style>
:root{--bg:#FEF5E1;--card:#FFFBF0;--gold:#c98a1b;--gold2:#6b3410;--tx:#4a230a;--mut:#8a6a4a;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--tx);font-family:Poppins,system-ui,sans-serif;line-height:1.7;overflow-x:hidden}
h1,h2,h3{font-family:Cinzel,Georgia,serif;font-weight:500;color:var(--gold2);margin:0 0 .5rem}
section{padding:64px 20px;max-width:1040px;margin:auto;position:relative}
.stars{position:fixed;inset:0;z-index:0;pointer-events:none}.stars i{position:absolute;width:2px;height:2px;background:#e0a52a;border-radius:50%;animation:tw 3s infinite alternate}
@keyframes tw{from{opacity:.1}to{opacity:1}}@keyframes sp{to{transform:rotate(360deg)}}@keyframes fl{50%{transform:translateY(-18px)}}
main,nav,footer{position:relative;z-index:1}
nav{display:flex;justify-content:space-between;align-items:center;padding:12px 20px;gap:10px}nav b{font-family:Cinzel,serif;color:var(--gold)}
.btn{display:inline-block;background:linear-gradient(135deg,#f0b93a,#b87a10);color:#2b1303;border:0;padding:10px 22px;border-radius:30px;font:500 14px Poppins,sans-serif;cursor:pointer;text-decoration:none}
.btn.o{background:none;border:1px solid var(--gold);color:var(--gold2)}
#hero{text-align:center;min-height:86vh;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden}
.wheel{position:absolute;top:50%;left:50%;width:0;height:0;animation:sp 140s linear infinite;opacity:.22}
.wheel span{position:absolute;left:-14px;top:-14px;font-size:28px;color:var(--gold)}
.orbit{position:absolute;top:50%;left:50%;width:340px;height:340px;margin:-170px;border:1px dashed #e8b84a55;border-radius:50%;animation:sp 40s linear infinite}.orbit:after{content:"";position:absolute;top:-8px;left:50%;width:16px;height:16px;border-radius:50%;background:var(--gold2)}
.fl{position:absolute;font-size:30px;color:var(--gold);opacity:.35;animation:fl 6s ease-in-out infinite}
.logo{width:min(300px,70vw);position:relative}
.tag{font-family:Cinzel,serif;font-size:clamp(20px,4vw,30px);color:var(--gold2);margin:22px 0 6px;position:relative}
.sub{color:var(--mut);max-width:560px;position:relative}
.q{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-top:22px}
.q div,.card{background:var(--card);border:1px solid #e8b84a33;border-radius:16px;padding:20px}.q div{font-style:italic;color:var(--gold2);text-align:center}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px;margin-top:22px}
.card h3{font-size:17px}.pr{font-size:26px;color:var(--gold);margin:8px 0}.pr s{font-size:15px;color:var(--mut);margin-left:6px}
.pdf{display:flex;gap:20px;flex-wrap:wrap;align-items:center;justify-content:space-between;border-color:var(--gold)}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.steps .card b{color:var(--gold);font:700 26px Cinzel,serif}
.empty{border:1px dashed #e8b84a66;border-radius:16px;padding:28px;text-align:center;color:var(--mut)}
#adm{display:none;position:fixed;inset:0;background:#3a1a05cc;z-index:9;overflow:auto;padding:20px}#adm .in{background:var(--card);max-width:760px;margin:auto;padding:20px;border-radius:16px}
#adm input,#adm textarea{width:100%;background:#fff;color:var(--tx);border:1px solid #c98a1b88;border-radius:8px;padding:7px;margin:3px 0;font:13px Poppins,sans-serif}
.r{display:grid;grid-template-columns:1.4fr .6fr .6fr 1.4fr;gap:6px;align-items:center;font-size:12px}@media(max-width:600px){.r{grid-template-columns:1fr 1fr}}
.tmr{display:inline-block;margin-top:14px;padding:8px 18px;border:1px solid var(--gold);border-radius:30px;background:#fff;color:var(--gold2)}.tmr b{font-family:Cinzel,serif;color:#b8341a}.of{font-size:12px;color:#b8341a;font-style:normal;margin-left:6px}
#nt{position:fixed;top:env(safe-area-inset-top,0px);left:50%;transform:translate(-50%,-130%);z-index:8;background:linear-gradient(135deg,#f0b93a,#b87a10);color:#2b1303;padding:8px 18px;border-radius:0 0 14px 14px;font:500 13px Poppins,sans-serif;transition:transform .5s;max-width:92vw;text-align:center;box-shadow:0 4px 14px #0003}#nt.on{transform:translate(-50%,0)}
.btn{position:relative;overflow:hidden}.btn::after{content:"";position:absolute;top:0;left:-70%;width:40%;height:100%;background:linear-gradient(110deg,transparent,#fff9,transparent);transform:skewX(-20deg);animation:bs 3.4s infinite}@keyframes bs{0%{left:-70%}60%,100%{left:140%}}
#nt{overflow:hidden}#nt::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(110deg,transparent,#fffb,transparent);transform:skewX(-20deg);animation:bs 2.2s infinite}
section h2{background:linear-gradient(90deg,#6b3410,#d9a01e,#6b3410);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:hs 6s linear infinite}@keyframes hs{to{background-position:-200% 0}}
.rv{opacity:0;transform:translateY(28px);transition:opacity .8s,transform .8s}.rv.in{opacity:1;transform:none}
.r2{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:6px;align-items:center}@media(max-width:600px){.r2{grid-template-columns:1fr 1fr}}
.tag{animation:fu 1.2s both}@keyframes fu{from{opacity:0;transform:translateY(16px)}}
footer{text-align:center;padding:30px;color:var(--mut);font-size:13px}
</style></head><body>
